name: 构建 Windows 安装包

# 用法：
#   1) 手动：仓库 Actions → 左侧「构建 Windows 安装包」→ Run workflow
#      tag 填 v1.7.0，构建完自动把 exe 和免安装 zip 挂到该 Release
#   2) 自动：推 v* 标签时触发（git tag v1.7.1 && git push origin v1.7.1）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到哪个 Release（如 v1.7.0；留空则只构建不发布）"
        required: false
        default: "v1.7.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一个 tag 下 macOS / Windows 两个流程会同时往同一个 Release 传附件，
# 用同一个 concurrency 组让它们排队，避免「Release 还不存在」导致上传失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows 打包（x64）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 避免 Python 输出中文时按 cp1252 编码报 UnicodeEncodeError（会让步骤直接失败）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if (-not $v) { $v = "1.0.0" }
          "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: 安装打包依赖
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" "pynput>=1.7.6" "pillow>=10" "numpy>=1.24"
          python -c "import PyInstaller, pynput, PIL, numpy; print('deps ok')"

      - name: 打包主程序
        shell: bash
        run: python build/build.py

      - name: 生成安装程序
        shell: bash
        run: python build/make_setup.py

      - name: 压缩免安装目录
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          Compress-Archive -Path "dist/按键精灵" `
            -DestinationPath "dist/按键精灵-$v-Windows免安装版.zip" -Force
          # Release 上传时中文文件名会被清洗成 "-1.7.2-.exe"，
          # 这里再复制一份 ASCII 名，上传用 ASCII 名，用户下载后不会看到残缺文件名。
          Copy-Item "dist/按键精灵-$v-安装程序.exe" "dist/keymacro-$v-windows-setup.exe" -Force
          Copy-Item "dist/按键精灵-$v-Windows免安装版.zip" "dist/keymacro-$v-windows-portable.zip" -Force
          Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 按键精灵-${{ steps.ver.outputs.VERSION }}-Windows
          path: |
            dist/keymacro-*.exe
            dist/keymacro-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # 用 action 而不是 gh 命令：Release 不存在时会自动创建，
          # 且 macOS 流程先跑完时也能把附件追加进同一个 Release。
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/keymacro-${{ steps.ver.outputs.VERSION }}-windows-setup.exe
            dist/keymacro-${{ steps.ver.outputs.VERSION }}-windows-portable.zip
          fail_on_unmatched_files: true
          body: |
            按键精灵 v${{ steps.ver.outputs.VERSION }}

            **Windows**
            - `keymacro-${{ steps.ver.outputs.VERSION }}-windows-setup.exe`：双击安装（推荐）
            - `keymacro-${{ steps.ver.outputs.VERSION }}-windows-portable.zip`：解压即用；也是程序内「升级 → 检查更新」下载的升级包

            **macOS（Apple 芯片）**
            - `keymacro-${{ steps.ver.outputs.VERSION }}-macos-arm64.dmg`：拖进「应用程序」，首次打开请右键 →「打开」

            **升级**
            - 程序里「升级」窗口点「检查更新」即可自动拉取本页最新版本，无需填任何地址或 Token
            - macOS 首次录制前需在 系统设置 → 隐私与安全性 → 辅助功能 中授权本程序
