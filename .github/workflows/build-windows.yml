name: 构建 Windows 安装包

# 用法：
#   1) 手动：仓库 Actions → 左侧「构建 Windows 安装包」→ Run workflow
#      tag 填 v1.7.0，构建完自动把 exe 和免安装 zip 挂到该 Release
#   2) 自动：推 v* 标签时触发（git tag v1.7.1 && git push origin v1.7.1）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布到哪个 Release（如 v1.7.0；留空则只构建不发布）"
        required: false
        default: "v1.7.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 打包（x64）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if (-not $v) { $v = "1.0.0" }
          "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0" "pynput>=1.7.6" "pillow>=10"
          python -c "import PyInstaller, pynput, PIL; print('依赖就绪')"

      - name: 打包主程序
        run: python build/build.py

      - name: 生成安装程序
        run: python build/make_setup.py

      - name: 压缩免安装目录
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/按键精灵" `
            -DestinationPath "dist/按键精灵-${{ steps.ver.outputs.VERSION }}-Windows免安装版.zip" -Force
          Get-ChildItem dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 按键精灵-${{ steps.ver.outputs.VERSION }}-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Write-Host "发布到 Release：$tag"
          gh release view $tag
          gh release upload $tag `
            "dist/按键精灵-${{ steps.ver.outputs.VERSION }}-安装程序.exe" `
            "dist/按键精灵-${{ steps.ver.outputs.VERSION }}-Windows免安装版.zip" `
            --clobber
          Write-Host "上传完成："
          gh release view $tag --json assets --jq '.assets[].name'
